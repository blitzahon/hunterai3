<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>RAG Agent</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #0f1115;
    color: #e6e6e6;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 16px 24px;
    border-bottom: 1px solid #23262e;
    font-size: 18px;
    font-weight: 600;
  }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .msg {
    max-width: 70%;
    padding: 12px 16px;
    border-radius: 12px;
    line-height: 1.5;
    white-space: pre-wrap;
  }
  .user {
    align-self: flex-end;
    background: #2b5fff;
    color: white;
  }
  .assistant {
    align-self: flex-start;
    background: #1c1f26;
    border: 1px solid #2a2e37;
  }
  .assistant.loading {
    color: #8a8f98;
    font-style: italic;
  }
  form {
    display: flex;
    gap: 10px;
    padding: 16px 24px;
    border-top: 1px solid #23262e;
  }
  input {
    flex: 1;
    padding: 12px 14px;
    border-radius: 8px;
    border: 1px solid #2a2e37;
    background: #1c1f26;
    color: #e6e6e6;
    font-size: 15px;
  }
  input:focus { outline: 1px solid #2b5fff; }
  button {
    padding: 12px 20px;
    border-radius: 8px;
    border: none;
    background: #2b5fff;
    color: white;
    font-size: 15px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>

<header>🔍 RAG Agent</header>
<div id="chat"></div>

<form id="form">
  <input id="question" type="text" placeholder="Ask something about your documents..." autocomplete="off" />
  <button id="send" type="submit">Send</button>
</form>

<script>
  const chat = document.getElementById("chat");
  const form = document.getElementById("form");
  const input = document.getElementById("question");
  const sendBtn = document.getElementById("send");

  function addMessage(role, text) {
    const div = document.createElement("div");
    div.className = "msg " + role;
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const question = input.value.trim();
    if (!question) return;

    addMessage("user", question);
    input.value = "";
    sendBtn.disabled = true;

    const loadingEl = addMessage("assistant loading", "Thinking...");

    try {
      const res = await fetch("/api/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question }),
      });
      const data = await res.json();
      loadingEl.classList.remove("loading");
      loadingEl.textContent = data.answer || data.error || "Something went wrong.";
    } catch (err) {
      loadingEl.classList.remove("loading");
      loadingEl.textContent = "Request failed: " + err.message;
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  });
</script>

</body>
</html>
